# Review and supply private configuration before enabling daily operation.
services:
  - type: worker
    name: astral-stock-paper
    runtime: python
    plan: starter
    branch: main
    autoDeployTrigger: "off"
    buildCommand: pip install --disable-pip-version-check .
    startCommand: python -m astral_stock_agent.paper_worker
    disk:
      name: paper-state
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.18
      - key: PAPER_STORAGE_ROOT
        value: /var/data/astral
      - key: PAPER_WORKER_ENABLED
        value: "false"
      - key: PAPER_CANDIDATE_APPROVED
        value: "false"
      - key: PAPER_REPORTING_ENABLED
        value: "false"
      - key: PAPER_CONFIG_JSON
        sync: false
      - key: PAPER_US_SYMBOL
        sync: false
      - key: PAPER_BOOTSTRAP_SESSION
        sync: false
      - key: ALPHAVANTAGE_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
