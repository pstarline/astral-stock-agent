name: Telegram setup (manual only)
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: telegram-setup
  cancel-in-progress: false
jobs:
  setup:
    if: github.repository == 'pstarline/astral-stock-agent' && github.ref == 'refs/heads/main' && github.actor == 'pstarline' && github.triggering_actor == 'pstarline'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      # No checkout, third-party actions, dependencies, trading data or artifacts.
      - name: Return setup ID through the bot's private chat
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import HTTPRedirectHandler, Request, build_opener

          class SetupError(Exception):
              pass

          PHASE = 'runtime'
          SEND_ATTEMPTED = False
          SAFE_ERRORS = {
              'RUNTIME_GUARD': '수동 실행·main·소유자 실행 조건을 확인하세요.',
              'MISSING_SECRET': 'Repository secret TELEGRAM_BOT_TOKEN이 비어 있습니다.',
              'TOKEN_FORMAT': '토큰 형식이 잘못됐습니다. BotFather 토큰 전체를 따옴표 없이 등록하세요.',
              'WEBHOOK_ACTIVE': '기존 웹훅이 있어 중단했습니다. 웹훅을 자동 삭제하지 않습니다.',
              'QUEUE_LIMIT': '대기 메시지 상한에 도달했습니다. 자동 삭제하지 않습니다.',
              'INVALID_UPDATES': '메시지 응답 구조를 확인할 수 없습니다.',
              'NO_RECENT_COMMAND': '10분 이내 직접 보낸 /astral_setup 개인 메시지를 찾지 못했습니다.',
              'MULTIPLE_CHATS': '여러 개인 대화의 명령이 있어 수신 대상을 정하지 않았습니다.',
              'HTTP_401': 'Telegram 인증 실패: Secret의 토큰을 확인하세요.',
              'HTTP_403': 'Telegram 접근 거부: 봇 차단 여부와 대화 시작을 확인하세요.',
              'HTTP_404': 'Telegram API 대상을 찾지 못했습니다. 토큰 전체를 확인하세요.',
              'HTTP_409': '다른 메시지 조회 작업과 충돌했습니다. 자동 재시도하지 않습니다.',
              'HTTP_429': 'Telegram 요청 제한입니다. 자동 재시도하지 않습니다.',
              'HTTP_ERROR': 'Telegram HTTP 오류입니다. 원문은 출력하지 않습니다.',
              'NETWORK_ERROR': '네트워크 응답을 확인하지 못했습니다.',
          }

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise SetupError()

          def api(token, method, payload):
              request = Request(
                  'https://api.telegram.org/bot' + token + '/' + method,
                  data=json.dumps(payload).encode('utf-8'),
                  headers={'Content-Type': 'application/json'}, method='POST',
              )
              try:
                  with build_opener(NoRedirect()).open(request, timeout=10) as response:
                      raw = response.read(65537)
              except HTTPError as error:
                  code = 'HTTP_' + str(error.code) if type(error.code) is int and error.code in (401, 403, 404, 409, 429) else 'HTTP_ERROR'
                  raise SetupError(code) from None
              except (URLError, TimeoutError, OSError):
                  raise SetupError('NETWORK_ERROR') from None
              if len(raw) > 65536:
                  raise SetupError()
              result = json.loads(raw)
              if not isinstance(result, dict) or result.get('ok') is not True or 'result' not in result:
                  raise SetupError()
              return result['result']

          def positive_id(value):
              return type(value) is int and 0 < value < 2**52

          def select_chat(updates, username, now):
              if not isinstance(updates, list):
                  raise SetupError('INVALID_UPDATES')
              if len(updates) >= 100:
                  raise SetupError('QUEUE_LIMIT')
              candidates = set()
              for update in updates:
                  if not isinstance(update, dict):
                      raise SetupError()
                  message = update.get('message')
                  if not isinstance(message, dict):
                      continue
                  if message.get('text') not in ('/astral_setup', '/astral_setup@' + username):
                      continue
                  if any(key in message for key in ('forward_origin', 'forward_from', 'forward_from_chat', 'forward_sender_name', 'forward_date', 'via_bot', 'sender_chat', 'business_connection_id')):
                      continue
                  sender, chat = message.get('from'), message.get('chat')
                  if not isinstance(sender, dict) or not isinstance(chat, dict):
                      continue
                  date = message.get('date')
                  if type(date) is not int or not 0 <= now - date <= 600:
                      continue
                  if sender.get('is_bot') is not False or chat.get('type') != 'private':
                      continue
                  chat_id = chat.get('id')
                  if positive_id(chat_id) and type(sender.get('id')) is int and sender['id'] == chat_id:
                      candidates.add(chat_id)
              if not candidates:
                  raise SetupError('NO_RECENT_COMMAND')
              if len(candidates) != 1:
                  raise SetupError('MULTIPLE_CHATS')
              return candidates.pop()

          def main():
              global PHASE, SEND_ATTEMPTED
              PHASE, SEND_ATTEMPTED = 'runtime', False
              # Independent runtime guards also protect manual reruns.
              expected = {
                  'GITHUB_ACTIONS': 'true', 'GITHUB_EVENT_NAME': 'workflow_dispatch',
                  'GITHUB_REPOSITORY': 'pstarline/astral-stock-agent',
                  'GITHUB_REF': 'refs/heads/main', 'GITHUB_ACTOR': 'pstarline',
                  'GITHUB_TRIGGERING_ACTOR': 'pstarline',
              }
              if any(os.environ.get(key) != value for key, value in expected.items()):
                  raise SetupError('RUNTIME_GUARD')
              PHASE = 'secret'
              token = os.environ.get('TELEGRAM_BOT_TOKEN', '').strip()
              if not token:
                  raise SetupError('MISSING_SECRET')
              if not re.fullmatch(r'[0-9]+:[A-Za-z0-9_-]{20,}', token):
                  raise SetupError('TOKEN_FORMAT')
              PHASE = 'webhook'
              webhook = api(token, 'getWebhookInfo', {})
              if not isinstance(webhook, dict) or webhook.get('url') != '':
                  raise SetupError('WEBHOOK_ACTIVE')
              PHASE = 'identity'
              bot = api(token, 'getMe', {})
              if not isinstance(bot, dict) or bot.get('is_bot') is not True or not positive_id(bot.get('id')):
                  raise SetupError()
              username = bot.get('username')
              if not isinstance(username, str) or not re.fullmatch(r'[A-Za-z0-9_]{5,32}', username):
                  raise SetupError()
              # No offset: do not acknowledge/delete pending updates. No allowed_updates mutation.
              PHASE = 'updates'
              updates = api(token, 'getUpdates', {'timeout': 0, 'limit': 100})
              PHASE = 'command'
              chat_id = select_chat(updates, username, int(time.time()))
              text = (
                  'Astral 설정 안내 · 거래 보고가 아닙니다.\n'
                  'TELEGRAM_CHAT_ID: ' + str(chat_id) + '\n'
                  'GitHub의 astral-stock-agent → Settings → Secrets and variables → Actions에서 '
                  'TELEGRAM_CHAT_ID라는 Secret으로 숫자만 등록하세요.\n'
                  '이 작업은 수신 대상을 저장하거나 자동 보고를 활성화하지 않습니다.'
              )
              PHASE, SEND_ATTEMPTED = 'send', True
              sent = api(token, 'sendMessage', {
                  'chat_id': chat_id, 'text': text, 'protect_content': True,
                  'disable_notification': True,
              })
              if not isinstance(sent, dict) or not positive_id(sent.get('message_id')):
                  raise SetupError()
              sent_chat = sent.get('chat')
              if not isinstance(sent_chat, dict) or sent_chat.get('type') != 'private' or type(sent_chat.get('id')) is not int or sent_chat['id'] != chat_id:
                  raise SetupError()
              print('설정 안내 API 승인 확인. 실제 수신은 Telegram에서 확인하세요.')

          if __name__ == '__main__':
              try:
                  main()
              except Exception as error:
                  # Never print API errors/URLs, updates, IDs or credentials. Never retry a send.
                  phase = PHASE if PHASE in ('runtime', 'secret', 'webhook', 'identity', 'updates', 'command', 'send') else 'unknown'
                  code = error.args[0] if type(error) is SetupError and len(error.args) == 1 and type(error.args[0]) is str else ''
                  detail = SAFE_ERRORS.get(code, '응답 검증 실패입니다. 원문은 출력하지 않습니다.')
                  print('진단 단계: ' + phase + ' / ' + detail)
                  print('전송 시도: ' + ('있음 · 전송 결과를 대조하기 전 재실행하지 마세요.' if SEND_ATTEMPTED else '없음'))
                  print('설정 안내 완료를 확인하지 못했습니다. 자동 재시도하지 않습니다.')
                  raise SystemExit(2) from None
          PY
